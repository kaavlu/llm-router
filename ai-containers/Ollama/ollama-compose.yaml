services:
  ollama:
    container_name: ollama
    image: ollama/ollama:latest

    ports:
      - "11434:11434"

    volumes:
      # Use system Ollama data (where ollama service stores models) so existing models are available
      - /usr/share/ollama/.ollama:/root/.ollama

    deploy:
      resources:
        reservations:
          devices:
            - capabilities: ["gpu"]

    restart: unless-stopped
    
    environment:
      - CUDA_VISIBLE_DEVICES=0,1

    networks:
      - localai_ai_network

networks:
  localai_ai_network:
    external: true
