services:
  openwebui:
    container_name: openwebui

    ## Change to your platform example linux/arm64 or linux/amd64
    platform: linux/amd64

    ## Look at docs https://github.com/open-webui/open-webui
    image: ghcr.io/open-webui/open-webui:main

    ## Port to expose on machine (host 8001, container 3000)
    ports:
      - 8001:3000
      
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ## Model Volume mount <local path>:/app/backend/data
    volumes:
      - /home/manavk/robotf-ai-suite/openwebui:/app/backend/data

    ## Environment variables see docs
    environment:
      - PORT=3000
      - OPENAI_API_BASE_URL=http://localai:8080/v1
      - OLLAMA_BASE_URL=http://172.17.0.1:11434

    networks:
      - localai_ai_network

    deploy:
      resources:
        reservations:
          devices:
            - capabilities: ["gpu"]
    stdin_open: true
    tty: true
    restart: unless-stopped

networks:
  localai_ai_network:
    external: true
